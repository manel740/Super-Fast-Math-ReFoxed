[[mods]]
modId="superfastmath"
version="${file.jarVersion}"
displayName="SuperFastMath"
displayURL="https://github.com/ItzjustElias/FastMathMod/"
credits="Ported to NeoForge by maintaining original optimizations"
authors="Elias"
description='''This mod uses precomputed sin and cos via a table and sets them dynamically, which makes math way faster.

Optimizations:
- Faster sine & cosine via optimized lookup tables
- Hardware-accelerated square root (native SQRTSS instruction)
- Improved floor and clamp operations
- Optimized interpolation (lerp) using fused multiply-add
- BlockPos bit-packing for faster chunk coordinate encoding'''

[[dependencies.superfastmath]]
modId="neoforge"
mandatory=true
versionRange="[21.1,)"
ordering="NONE"
side="BOTH"

# No Fabric API dependency needed - mod uses only vanilla/NeoForge APIs

